name: Deploy to AWS EC2

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:  # 수동 실행 허용

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. 코드 체크아웃
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. JDK 11 설정
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    # 3. application.properties 생성
    - name: Create application.properties
      run: |
        mkdir -p Project_4team/src/main/resources
        cat > Project_4team/src/main/resources/application.properties << EOF
        # Database Configuration
        db.driver=com.mysql.cj.jdbc.Driver
        db.url=${{ secrets.DB_URL }}
        db.username=${{ secrets.DB_USERNAME }}
        db.password=${{ secrets.DB_PASSWORD }}

        # Google Mail
        GOOGLE_SENDER_MAIL=${{ secrets.GOOGLE_SENDER_MAIL }}
        GOOGLE_APPLICATION_PASSWORD=${{ secrets.GOOGLE_APPLICATION_PASSWORD }}

        # Naver OAuth
        NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
        NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}

        # Kakao OAuth & API
        KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
        KAKAO_API_KEY=${{ secrets.KAKAO_API_KEY }}

        # Expressway API
        EXPRESSWAY_ID=${{ secrets.EXPRESSWAY_ID }}

        # TMap API
        tmap.appkey=${{ secrets.TMAP_APPKEY }}

        # AWS S3
        aws.accessKeyId=${{ secrets.AWS_ACCESS_KEY_ID }}
        aws.secretAccessKey=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws.s3.bucketName=${{ secrets.AWS_S3_BUCKET_NAME }}
        aws.s3.bucketUrl=${{ secrets.AWS_S3_BUCKET_URL }}

        # Server Configuration
        server.domain=${{ secrets.SERVER_DOMAIN }}
        server.port=${{ secrets.SERVER_PORT }}
        server.context=${{ secrets.SERVER_CONTEXT }}

        # OAuth Redirect URI
        oauth.redirect.base=http://\${server.domain}:\${server.port}\${server.context}
        EOF

    # 4. conf.xml 생성
    - name: Create MyBatis conf.xml
      run: |
        mkdir -p Project_4team/src/main/resources/mybatis/config
        cat > Project_4team/src/main/resources/mybatis/config/conf.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE configuration PUBLIC "-//mybatis.org//DTD Config 3.0//EN"
            "http://mybatis.org/dtd/mybatis-3-config.dtd">
        <configuration>
            <properties resource="application.properties"/>
            <settings>
                <setting name="mapUnderscoreToCamelCase" value="true"/>
                <setting name="jdbcTypeForNull" value="NULL"/>
                <setting name="logImpl" value="STDOUT_LOGGING"/>
            </settings>
            <typeAliases>
                <package name="mybatis.vo"/>
            </typeAliases>
            <environments default="development">
                <environment id="development">
                    <transactionManager type="JDBC"/>
                    <dataSource type="POOLED">
                        <property name="driver" value="${db.driver}"/>
                        <property name="url" value="${db.url}"/>
                        <property name="username" value="${db.username}"/>
                        <property name="password" value="${db.password}"/>
                        <property name="poolMaximumActiveConnections" value="20"/>
                        <property name="poolMaximumIdleConnections" value="10"/>
                        <property name="poolMaximumCheckoutTime" value="20000"/>
                        <property name="poolTimeToWait" value="20000"/>
                    </dataSource>
                </environment>
            </environments>
            <mappers>
                <mapper resource="mybatis/mapper/bbs.xml"/>
                <mapper resource="mybatis/mapper/bookmark.xml"/>
                <mapper resource="mybatis/mapper/crawlingdata.xml"/>
                <mapper resource="mybatis/mapper/gas.xml"/>
                <mapper resource="mybatis/mapper/likeHate.xml"/>
                <mapper resource="mybatis/mapper/login.xml"/>
                <mapper resource="mybatis/mapper/menu.xml"/>
                <mapper resource="mybatis/mapper/serviceArea.xml"/>
                <mapper resource="mybatis/mapper/shop.xml"/>
                <mapper resource="mybatis/mapper/signUp.xml"/>
                <mapper resource="mybatis/mapper/user.xml"/>
            </mappers>
        </configuration>
        EOF

    # 5. Maven 빌드
    - name: Build with Maven
      working-directory: Project_4team
      run: mvn clean package -DskipTests

    # 6. WAR 파일 확인
    - name: Verify WAR file
      run: |
        ls -lh Project_4team/target/*.war
        echo "WAR file created successfully"

    # 7. EC2 연결 테스트
    - name: Test EC2 Connection
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        echo "🔍 EC2 연결 테스트 시작..."
        echo "Target: $USER@$HOST"

        # SSH 키 설정
        printf '%s\n' "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem

        # 키 검증
        echo "✓ SSH 키 파일 생성: $(wc -l < private_key.pem) lines"
        if ssh-keygen -y -f private_key.pem > /dev/null 2>&1; then
          echo "✓ SSH 키 검증 성공"
        else
          echo "❌ SSH 키 검증 실패"
          exit 1
        fi

        # 네트워크 연결 테스트
        echo "🌐 네트워크 연결 테스트..."
        if timeout 10 nc -zv $HOST 22 2>&1; then
          echo "✓ 포트 22 연결 가능"
        else
          echo "❌ 포트 22 연결 실패 (타임아웃)"
          echo ""
          echo "💡 문제 해결 방법:"
          echo "1. EC2 인스턴스가 실행 중인지 확인"
          echo "2. 보안 그룹에서 포트 22 허용 확인"
          echo "3. EC2_HOST 값이 최신 퍼블릭 IP인지 확인"
          echo "4. 트러블슈팅 가이드 참고: Project_4team/docs/TROUBLESHOOTING_SSH.md"
          rm -f private_key.pem
          exit 1
        fi

        # SSH 연결 테스트
        echo "🔐 SSH 연결 테스트..."
        if timeout 15 ssh -i private_key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 $USER@$HOST "echo '✓ SSH 연결 성공'"; then
          echo "✅ EC2 연결 테스트 통과"
        else
          echo "❌ SSH 인증 실패"
          echo ""
          echo "💡 가능한 원인:"
          echo "1. EC2_SSH_KEY 값이 올바른지 확인"
          echo "2. EC2_USER 값 확인 (ubuntu/ec2-user)"
          echo "3. SSH 키가 EC2 인스턴스에 등록되어 있는지 확인"
          rm -f private_key.pem
          exit 1
        fi

        rm -f private_key.pem

    # 8. EC2에 배포 (SSH)
    - name: Deploy to EC2
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ${{ secrets.EC2_USER }}
      run: |
        echo "🚀 EC2 배포 시작..."

        # SSH 키 설정
        printf '%s\n' "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem

        # WAR 파일 전송
        echo "📦 WAR 파일 전송 중..."
        if scp -i private_key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
          Project_4team/target/*.war $USER@$HOST:/tmp/app.war; then
          echo "✓ WAR 파일 전송 완료"
        else
          echo "❌ WAR 파일 전송 실패"
          rm -f private_key.pem
          exit 1
        fi

        # 서버에서 배포
        echo "🔧 애플리케이션 배포 중..."
        ssh -i private_key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=30 $USER@$HOST << 'ENDSSH'
          set -e  # 오류 발생 시 즉시 중단

          echo "Stopping Tomcat..."
          sudo systemctl stop tomcat9 || true

          echo "Removing old application..."
          sudo rm -rf /opt/tomcat9/webapps/ROOT
          sudo rm -f /opt/tomcat9/webapps/ROOT.war

          echo "Deploying new WAR file..."
          sudo mv /tmp/app.war /opt/tomcat9/webapps/ROOT.war
          sudo chown tomcat:tomcat /opt/tomcat9/webapps/ROOT.war

          echo "Starting Tomcat..."
          sudo systemctl start tomcat9

          echo "Waiting for deployment..."
          sleep 30

          echo "Checking Tomcat status..."
          if sudo systemctl is-active --quiet tomcat9; then
            echo "✅ Tomcat is running"
            sudo systemctl status tomcat9 --no-pager | head -20
          else
            echo "❌ Tomcat failed to start"
            sudo journalctl -u tomcat9 -n 50 --no-pager
            exit 1
          fi
        ENDSSH

        # SSH 키 삭제
        rm -f private_key.pem
        echo "✅ 배포 완료!"

    # 9. 배포 결과 알림
    - name: Deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ 배포 성공!"
          echo "애플리케이션 URL: http://${{ secrets.SERVER_DOMAIN }}:${{ secrets.SERVER_PORT }}"
        else
          echo "❌ 배포 실패!"
          echo "트러블슈팅 가이드: Project_4team/docs/TROUBLESHOOTING_SSH.md"
        fi
